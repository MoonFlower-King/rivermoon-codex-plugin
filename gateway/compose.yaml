services:
  rivermoon-codex-gateway:
    build: .
    container_name: rivermoon-codex-gateway
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - rivermoon-codex-gateway-data:/var/lib/rivermoon-codex-gateway
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rivermoon-codex-gateway-data:
